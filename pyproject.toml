[project]
name = "github-connector-project"
version = "0.1.0"
description = "A Github API request module"
authors = [
    {name = "campeon",email = "ogunlanaoluwaseyi0778@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]
